# 매일 하는 자동 작업 두 가지
#  1) 카드 도감(pokemon_cards)을 CSV로 백업하고, 사이트용 카드 목록 파일(public/data/cards.json)도 만들어 커밋
#     → 카드가 바뀌었으면 사이트를 다시 배포 (사이트는 이 파일 + 바뀐 카드만 읽어서 데이터베이스 읽기가 거의 없다)
#  2) 썸네일이 없는 카드 사진만 골라 썸네일(public/thumbs)을 만들고,
#     새로 만든 게 있으면 커밋한 뒤 사이트를 바로 다시 배포
#     (봇이 올린 커밋은 "머지하면 배포" 작업을 다시 일으키지 않아서, 여기서 직접 배포한다)
# - 매일 새벽 3시 17분(한국 시간)에 자동 실행
# - Actions 탭 → "Backup card database" → "Run workflow" 버튼으로 언제든 바로 실행 가능
# - 바뀐 내용이 없으면 커밋·배포하지 않는다. (대부분의 날은 1분 안에 끝남)
# 깃허브가 자동으로 주는 임시 토큰(GITHUB_TOKEN)과 이미 등록된 Firebase 배포 키만 쓴다.
name: Backup card database

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup-cards
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"

      - run: node scripts/backup-cards.mjs database_backups/main_dataset.csv
      - name: 백업이 바뀌었으면 커밋
        id: backup
        run: |
          git add -N database_backups/catalog.json public/data/cards.json 2>/dev/null || true
          if git diff --quiet -- database_backups/main_dataset.csv database_backups/catalog.json public/data/cards.json; then
            echo "바뀐 카드가 없어서 커밋하지 않습니다."
            exit 0
          fi
          STAMP=$(TZ=Asia/Seoul date +%Y-%m-%d_%H-%M-%S)
          cp database_backups/main_dataset.csv "database_backups/backup_${STAMP}.csv"
          COUNT=$(($(grep -c '' database_backups/main_dataset.csv) - 1))
          git add database_backups public/data/cards.json
          git commit -m "카드 DB 자동 백업: ${STAMP} (총 ${COUNT}건)"
          git pull --rebase origin main
          git push
          # 사이트의 카드 목록 파일(public/data/cards.json)이 바뀌었으니 아래에서 다시 배포한다
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 빠진 썸네일 만들기
        id: thumbs
        run: |
          node scripts/make-thumbnails.mjs
          git add -A public/thumbs
          if git diff --cached --quiet -- public/thumbs; then
            echo "새로 만든 썸네일이 없어서 커밋·배포하지 않습니다."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          N=$(git diff --cached --name-only -- public/thumbs | wc -l)
          git commit -m "카드 썸네일 자동 생성: ${N}장"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 사이트 빌드 (새 카드 목록·썸네일 반영)
        if: steps.backup.outputs.changed == 'true' || steps.thumbs.outputs.changed == 'true'
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GITHUB_OWNER: ${{ secrets.VITE_GITHUB_OWNER }}
          VITE_GITHUB_REPO: ${{ secrets.VITE_GITHUB_REPO }}
          VITE_GITHUB_BACKUP_PATH: ${{ secrets.VITE_GITHUB_BACKUP_PATH }}

      - name: 사이트 배포
        if: steps.backup.outputs.changed == 'true' || steps.thumbs.outputs.changed == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POKEMONCARD_0319 }}
          channelId: live
          projectId: pokemoncard-0319
