# 사진 찾기 창에서 쓸 "공식 카드 목록" 파일을 만든다.
#  - jp.json        : 일본 공식 카드 검색 결과 (이름·세트·사진, 약 10분)
#  - jp-detail.json : 일본 카드 상세 (번호·레어도·도감 번호) — 한 장씩 천천히, 이어서 모음
#  - kr.json        : 한국 공식 카드 상세 (이름·세트·번호·레어도·종류·도감 번호·사진) — 한 장씩 천천히, 이어서 모음
#  천천히 모으는 목록은 한 번에 최대 약 5시간만 읽고 저장한 뒤 다음 실행 때 이어서 읽는다.
#  다 모은 뒤에는 새로 나온 카드만 읽는다.
# 실행 시각 (한국 시간)
#  - 매주 월요일 새벽 4시 23분: 전부
#  - 매일 새벽 5시 41분: 아직 다 안 모아진 목록만 이어서 (다 모았으면 바로 끝남)
#  - Actions 탭 → "Build card image index" → "Run workflow" 로 언제든 실행 (all / jp / kr / continue)
#  - 천천히 모으는 목록이 아직 다 안 모였으면, 끝날 때 스스로 "continue"(이어서 모으기)를 다시 실행한다.
#    (이번 실행에서 한 장도 못 늘렸으면 멈춘다 — 사이트가 막았을 때 계속 두드리지 않도록)
# 만든 파일은 card-index 브랜치에만 올린다. (main 브랜치·사이트 배포와는 상관없음)
# 사이트는 jsDelivr(무료 CDN)로 불러온다: https://cdn.jsdelivr.net/gh/<저장소>@card-index/<파일>
# 올린 뒤 jsDelivr에 새로 고침을 요청해서 사이트에 바로 반영되게 한다.
# 깃허브가 자동으로 주는 임시 토큰(GITHUB_TOKEN)만 쓴다.
name: Build card image index

on:
  schedule:
    - cron: '23 19 * * 0'
    - cron: '41 20 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: '무엇을 만들까요?'
        type: choice
        options: [all, jp, kr, continue]
        default: all

permissions:
  contents: write
  actions: write

concurrency:
  group: card-index
  cancel-in-progress: false

env:
  WEEKLY: ${{ github.event_name == 'schedule' && github.event.schedule == '23 19 * * 0' }}
  DAILY: ${{ (github.event_name == 'schedule' && github.event.schedule == '41 20 * * *') || github.event.inputs.target == 'continue' }}
  TARGET: ${{ github.event.inputs.target || '' }}

jobs:
  # 지금 card-index 브랜치에 있는 목록을 가져와 다른 작업들에 넘겨준다
  prev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p prev
          if git fetch -q origin card-index; then
            for f in jp.json jp-detail.json kr.json; do git show "origin/card-index:$f" > "prev/$f" 2>/dev/null || rm -f "prev/$f"; done
          fi
          touch prev/.keep
          ls -la prev
      - uses: actions/upload-artifact@v4
        with:
          name: prev
          path: prev/
          include-hidden-files: true
          retention-days: 2

  jp-list:
    needs: prev
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '23 19 * * 0') || github.event.inputs.target == 'all' || github.event.inputs.target == 'jp' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 일본 공식 카드 목록 모으기
        run: node scripts/build-jp-card-index.mjs out/jp.json
      - uses: actions/upload-artifact@v4
        with:
          name: jp-list
          path: out/jp.json
          retention-days: 2

  # 일본 상세는 일본 목록이 끝난 뒤에 (같은 사이트에 동시에 요청하지 않도록)
  jp-detail:
    needs: [prev, jp-list]
    if: ${{ always() && needs.prev.result == 'success' && (needs.jp-list.result == 'success' || needs.jp-list.result == 'skipped') && ((github.event_name == 'schedule') || github.event.inputs.target == 'all' || github.event.inputs.target == 'jp' || github.event.inputs.target == 'continue') }}
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: prev
          path: prev
      - uses: actions/download-artifact@v4
        if: needs.jp-list.result == 'success'
        with:
          name: jp-list
          path: new
      - name: 일본 카드 상세 모으기 (천천히, 이어서)
        env:
          JPD_BUDGET_MIN: '290'
          JPD_ONLY_IF_INCOMPLETE: ${{ env.DAILY == 'true' && '1' || '' }}
        run: |
          LIST=new/jp.json; [ -f "$LIST" ] || LIST=prev/jp.json
          node scripts/build-jp-card-details.mjs "$LIST" out/jp-detail.json prev/jp-detail.json
          [ -f out/jp-detail.json ] || echo "새로 만든 상세 목록 없음"
      - uses: actions/upload-artifact@v4
        with:
          name: jp-detail
          path: out/jp-detail.json
          if-no-files-found: ignore
          retention-days: 2

  kr:
    needs: prev
    if: ${{ github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'kr' || github.event.inputs.target == 'continue' }}
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: prev
          path: prev
      - name: 한국 공식 카드 목록 모으기 (천천히, 이어서)
        env:
          KR_BUDGET_MIN: '290'
          KR_ONLY_IF_INCOMPLETE: ${{ env.DAILY == 'true' && '1' || '' }}
        run: node scripts/build-kr-card-index.mjs out/kr.json prev/kr.json
      - uses: actions/upload-artifact@v4
        with:
          name: kr
          path: out/kr.json
          if-no-files-found: ignore
          retention-days: 2

  publish:
    needs: [prev, jp-list, jp-detail, kr]
    if: ${{ always() && needs.prev.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: card-index 브랜치에 올리기
        run: |
          mkdir -p new
          # 이어서 실행할지 정할 때 쓰려고, 이전 목록을 따로 둔다 (아래에서 작업 폴더를 비우기 때문)
          mkdir -p "$RUNNER_TEMP/prev" && cp art/prev/*.json "$RUNNER_TEMP/prev/" 2>/dev/null || true
          [ -f art/jp-list/jp.json ] && cp art/jp-list/jp.json new/
          [ -f art/jp-detail/jp-detail.json ] && cp art/jp-detail/jp-detail.json new/
          [ -f art/kr/kr.json ] && cp art/kr/kr.json new/
          if [ -z "$(ls new)" ]; then echo "새로 만든 목록이 없어서 올리지 않습니다."; exit 0; fi
          # 이번에 안 만든 목록은 이전 것을 그대로 둔다
          for f in jp.json jp-detail.json kr.json; do
            if [ ! -f "new/$f" ] && [ -f "art/prev/$f" ]; then cp "art/prev/$f" "new/$f"; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan card-index-build
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name new -exec rm -rf {} +
          mv new/*.json . && rmdir new
          printf '# card-index\n\n사진 찾기 창에서 쓰는 카드 목록 파일만 두는 브랜치예요. GitHub Actions가 자동으로 새로 만들어요.\n' > README.md
          git add *.json README.md
          cnt() { [ -f "$1" ] && node -e "const d=require('./$1');console.log(d.count + (d.complete === false ? ' (모으는 중)' : ''))" || echo 0; }
          MSG="카드 목록 갱신: 일본 $(cnt jp.json)장 · 일본 상세 $(cnt jp-detail.json)장 · 한국 $(cnt kr.json)장"
          git commit -qm "$MSG"
          git push -f origin HEAD:card-index
          echo "$MSG"
          # 사이트가 새 목록을 바로 쓰도록 jsDelivr(무료 CDN)에 저장해 둔 예전 파일을 지워 달라고 요청한다
          # (안 하면 jsDelivr가 예전 파일을 최대 반나절 동안 계속 보여준다. 실패해도 목록 올리기는 끝난 것이라 무시)
          for f in jp.json jp-detail.json kr.json; do
            curl -s -m 60 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@card-index/$f" -o /dev/null -w "jsDelivr 새로 고침 $f: %{http_code}\n" || echo "jsDelivr 새로 고침 $f 실패 (최대 반나절 뒤 반영)"
          done

      # 아직 다 안 모였고 이번에 조금이라도 늘었으면 이어서 모으기를 다시 실행한다
      - name: 다 안 모였으면 이어서 다시 실행
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          info() { [ -f "$1" ] && node -e "const d=require(require('path').resolve(process.argv[1]));console.log((d.count||0)+' '+(d.complete===false?'no':'yes'))" "$1" || echo "0 yes"; }
          read KR_NEW KR_DONE <<< "$(info kr.json)"
          read JPD_NEW JPD_DONE <<< "$(info jp-detail.json)"
          read KR_OLD _ <<< "$(info "$RUNNER_TEMP/prev/kr.json")"
          read JPD_OLD _ <<< "$(info "$RUNNER_TEMP/prev/jp-detail.json")"
          echo "한국 $KR_OLD → $KR_NEW (다 모음: $KR_DONE) · 일본 상세 $JPD_OLD → $JPD_NEW (다 모음: $JPD_DONE)"
          if [ "$KR_DONE" = "yes" ] && [ "$JPD_DONE" = "yes" ]; then echo "모두 다 모았어요."; exit 0; fi
          if [ "$KR_NEW" -le "$KR_OLD" ] && [ "$JPD_NEW" -le "$JPD_OLD" ]; then echo "이번에 늘어난 카드가 없어서 멈춥니다. (매일 새벽 실행 때 다시 시도)"; exit 0; fi
          gh workflow run card-index.yml --repo "$GITHUB_REPOSITORY" --ref main -f target=continue
          echo "이어서 모으기를 다시 실행했어요."
